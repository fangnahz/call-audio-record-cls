[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "call-audio-record-cls"
version = "0.1.0"
description = "Minimal async pipeline scaffold for OSS-backed call ASR and intent classification."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alibabacloud-oss-v2>=1.2.4",
  "httpx>=0.28.1",
  "openai>=2.29.0",
  "pydantic>=2.11.3",
  "python-dotenv>=1.1.1",
  "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.5",
]

[project.scripts]
call-audio-pipeline = "call_audio_record_cls.cli:main"
call-audio-asr-sample = "call_audio_record_cls.sample_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/call_audio_record_cls"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
